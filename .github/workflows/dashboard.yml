name: SPY Volatility Lab
on:
  pull_request:
    paths: ['dashboard/**', 'src/**', 'configs/**', 'tests/**', 'scripts/**', '.github/**', '.python-version', 'requirements-lock.txt', 'pyproject.toml']
  push:
    branches: [main]
    paths: ['dashboard/**', 'src/**', 'configs/**', '.github/**', '.python-version', 'requirements-lock.txt', 'pyproject.toml']
  workflow_dispatch:
  schedule:
    - cron: '7,37 21,22 * 11,12 1-5'
    - cron: '7,37 18,19 27 11 *'
permissions:
  contents: read
concurrency:
  group: spy-pilot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  research-check:
    if: github.event_name == 'pull_request'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/research-python
      - name: Check collection windows and release boundaries
        run: python -m pytest -q tests/workflows/test_dashboard_pilot.py tests/workflows/test_hosted_pilot.py tests/workflows/test_pilot_service.py tests/workflows/test_retention_probe.py tests/workflows/test_operations.py tests/workflows/test_public_export.py tests/workflows/test_public_history.py tests/infrastructure/test_retention.py
  gate:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PILOT_HOSTED == 'true'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.date.outputs.run }}
    steps:
      - id: date
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != schedule || "$(date -u +%Y%m%d)" -le 20261223 ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
  collect:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    environment: pilot-evidence
    outputs:
      release: ${{ steps.export.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: app
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: pandeyp1426/spy-volatility-pilot-evidence
          ref: main
          path: state
          ssh-key: ${{ secrets.PILOT_EVIDENCE_SSH_KEY }}
      - uses: ./app/.github/actions/research-python
        with:
          directory: app
      - name: Mount private state
        run: |
          foreach ($name in 'artifacts','data') {
            New-Item -ItemType Junction -Path "app/$name" -Target (Resolve-Path "state/$name") | Out-Null
          }
      - name: Collect eligible completed session
        id: tick
        if: vars.PILOT_WRITER != 'windows'
        working-directory: app
        run: |
          python -m spy_volatility.workflows.hosted_pilot tick 2> "$env:RUNNER_TEMP/pilot-error.log"
          if ($LASTEXITCODE) { throw 'Collection failed. Inspect the checkpointed private attempt.' }
      - name: Persist private evidence before release
        id: checkpoint
        if: "!cancelled() && vars.PILOT_WRITER != 'windows' && (steps.tick.outcome == 'success' || steps.tick.outcome == 'failure')"
        working-directory: state
        run: |
          git add -- artifacts/operations/journal.sqlite3 artifacts/operations/pilot_2026
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($LASTEXITCODE -ne 1) { exit $LASTEXITCODE }
          git -c user.name=pilot-collector -c user.email=pilot-collector@users.noreply.github.com commit -q -m "Checkpoint 2026 pilot evidence"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git push -q origin HEAD:main
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Replay entire private journal
        id: verify
        working-directory: app
        run: |
          python -m spy_volatility.workflows.hosted_pilot verify 2> "$env:RUNNER_TEMP/verify-error.log"
          if ($LASTEXITCODE) { throw 'Private journal replay failed.' }
          "## Verification`n`nPrivate journal and numerical replay passed." >> $env:GITHUB_STEP_SUMMARY
          if ('${{ vars.PILOT_WRITER }}' -eq 'windows') {
            "## Collection`n`nExternal Windows scheduler owns issuance. This job created no forecast; it restored the private checkpoint." >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Replay and project public fields
        id: export
        working-directory: app
        run: |
          $flags = @()
          if ($env:GITHUB_EVENT_NAME -eq 'schedule') { $flags += '--only-changed' }
          $result = python -m spy_volatility.workflows.hosted_pilot release @flags 2> "$env:RUNNER_TEMP/replay-error.log"
          if ($LASTEXITCODE -or $result -notin 'current','publish') { throw 'Public replay failed.' }
          "release=$result" >> $env:GITHUB_OUTPUT
          "## Publication preparation`n`n$result (deployment is reported separately)." >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: steps.export.outputs.release == 'publish'
        with:
          name: verified-public-data
          path: app/dashboard/public/data/*.json
          if-no-files-found: error
          retention-days: 1
  check:
    needs: collect
    if: >-
      !cancelled() && (needs.collect.outputs.release == 'publish' ||
      (needs.collect.result == 'skipped' && github.event_name != 'schedule'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        if: needs.collect.outputs.release == 'publish'
        with:
          name: verified-public-data
          path: dashboard/public/data
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-pages-artifact@v4
        if: needs.collect.outputs.release == 'publish'
        with:
          path: dashboard/dist
  deploy:
    if: github.ref == 'refs/heads/main' && needs.collect.outputs.release == 'publish'
    runs-on: ubuntu-latest
    needs: [collect, check]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish approved static build
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report deployment
        run: echo 'Deployment succeeded. ${{ steps.deployment.outputs.page_url }}' >> "$GITHUB_STEP_SUMMARY"
  report:
    if: always() && github.event_name != 'pull_request'
    needs: [gate, collect, check, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Distinguish collection, verification and deployment
        run: |
          echo "Pilot writer: ${{ vars.PILOT_WRITER || 'github' }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Private checkpoint/replay job: ${{ needs.collect.result }}' >> "$GITHUB_STEP_SUMMARY"
          echo "Publication decision: ${{ needs.collect.outputs.release || 'none' }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Dashboard checks: ${{ needs.check.result }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Pages deployment: ${{ needs.deploy.result }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'A successful run with no forecast is maintenance, not successful issuance.' >> "$GITHUB_STEP_SUMMARY"

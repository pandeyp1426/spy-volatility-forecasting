# Prespecified retrospective development experiment; the pooled test stays reserved.
# Freeze this file and record its SHA-256 before any temporal scoring.
[data]
ticker = "SPY"
start = "2014-11-01"
end = "2026-01-01"
calendar = "NYSE"

[research]
windows = [5, 10, 20]
horizon = 5
momentum_window = 5
baseline_window = 20

[paths]
snapshot_dir = "data/raw/spy_2014-11-01_2026-01-01"
output_dir = "artifacts/runs"
pooled_run = "artifacts/runs/20261024T163643_pooled_b62233b3"

[experiment]
strategy = "retrospective_temporal"
name = "annual_expanding_development_2020_2025"

[temporal]
name = "retrospective_expanding_annual_development"
training_start = "2015-01-01"
outer_years = [2020, 2021, 2022, 2023, 2024, 2025]
inner_year_count = 3
selection_metric = "rmse_pp"
tie_break = "lowest_candidate_id"
high_volatility_quantile = 0.95
prediction_floor = 0.0
reserved_policy = "Exclude saved pooled reserved row identities from every fit and score."
label_rule = "training_target_end <= actual last price session before evaluation year"
inner_label_rule = "inner evaluation target_end <= outer fit cutoff"

[fixed.ridge]
alpha = 1.0

[fixed.random_forest]
n_estimators = 200
max_depth = 5
min_samples_leaf = 10
max_features = "sqrt"
random_state = 42
n_jobs = 1

[fixed.gradient_boosting]
n_estimators = 200
max_depth = 2
learning_rate = 0.03
min_samples_leaf = 10
loss = "squared_error"
random_state = 42

# Ordered candidates; ties in concatenated inner RMSE choose the first ID.
[search.ridge]
alpha = [0.01, 0.1, 1.0, 10.0, 100.0]

[search.random_forest]
max_depth = [3, 5, 8]
min_samples_leaf = [5, 10, 20]

[search.gradient_boosting]
n_estimators = [100, 200]
learning_rate = [0.03, 0.05]
max_depth = [1, 2, 3]
